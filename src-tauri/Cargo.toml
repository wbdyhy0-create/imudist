[package]
name = "imudist"
version = "0.0.38"
description = "Imudist desktop publishing application"
authors = ["Imudist"]
edition = "2021"

[lib]
name = "imudist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
fontdb = "0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.6.0"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.14"

# every release of the `zip` crate that the updater plugin accepts (^4) was withdrawn from crates.io; the plugin only uses it to open .zip update
# packages, which Imudist never publishes (Windows updates are the signed installer itself), so the last 4.x is taken from its repository
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v4.6.1" }
