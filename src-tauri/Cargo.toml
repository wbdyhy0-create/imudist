[package]
name = "imudist"
version = "0.0.26"
description = "Imudist desktop publishing application"
authors = ["Imudist"]
edition = "2021"

[lib]
name = "imudist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.6.0"
