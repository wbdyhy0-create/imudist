name: Build macOS and Windows

on:
  workflow_dispatch:
    inputs:
      trial_days:
        description: 'Length of the trial build, in days'
        default: '180'
      publish:
        description: 'Publish the builds as updates (needs the secrets named in docs/UPDATES.md)'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, variant: full }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, variant: full }
          - { runner: macos-latest, target: aarch64-apple-darwin, variant: trial }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, variant: trial }
    runs-on: ${{ matrix.runner }}
    env:
      TRIAL_DAYS: ${{ inputs.trial_days || '180' }}
      # the key the updater files are signed with (its public half is in tauri.conf.json); a secret, never in the repository
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # the key has no password (a secret cannot be empty, so there is none to read)
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # the trial variant stops working after the given number of days from its first start (VITE_TRIAL_DAYS, see src/trial.ts)
      # a trial build looks for its updates in its own list (src-tauri/tauri.trial.conf.json)
      - run: npx tauri build --target ${{ matrix.target }} --bundles app,dmg ${{ matrix.variant == 'trial' && '--config src-tauri/tauri.trial.conf.json' || '' }}
        env:
          VITE_TRIAL_DAYS: ${{ matrix.variant == 'trial' && env.TRIAL_DAYS || '' }}

      - name: Check the app signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/${{ matrix.target }}/release/bundle/macos/Imudist.app

      - name: Mark the trial installer in its name
        if: matrix.variant == 'trial'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/dmg
          for f in *.dmg; do mv "$f" "${f%.dmg}-trial-${TRIAL_DAYS}d.dmg"; done

      - uses: actions/upload-artifact@v4
        with:
          name: imudist-mac-${{ matrix.variant == 'trial' && format('trial-{0}d', env.TRIAL_DAYS) || 'full' }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # the Windows installer of the update (the one the programs download); signed with the same key. The installers that are sent by hand
  # are built on the developer's machine (scripts/build-release.mjs, scripts/build-trial.mjs)
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        variant: [full, trial]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TRIAL_DAYS: ${{ inputs.trial_days || '180' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # the key has no password (a secret cannot be empty, so there is none to read)
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # the program's own code is built without optimisation: the model is built into it, and the compiler runs out of memory otherwise
      - run: npx tauri build --bundles nsis ${{ matrix.variant == 'trial' && '--config src-tauri/tauri.trial.conf.json' || '' }} -- --config profile.release.package.imudist.opt-level=0
        env:
          VITE_TRIAL_DAYS: ${{ matrix.variant == 'trial' && env.TRIAL_DAYS || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: imudist-win-${{ matrix.variant == 'trial' && format('trial-{0}d', env.TRIAL_DAYS) || 'full' }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  # the builds become updates: each installer goes to the release of the releases repository, and the list the programs read is changed
  publish:
    needs: [build-mac, build-windows]
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      TRIAL_DAYS: ${{ inputs.trial_days || '180' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        run: bash scripts/publish-ci.sh
