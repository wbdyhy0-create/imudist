name: Build macOS

on:
  workflow_dispatch:
    inputs:
      trial_days:
        description: 'Length of the trial build, in days'
        default: '180'
      publish:
        description: 'Publish the builds as updates (needs the secrets named in docs/UPDATES.md)'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, variant: full }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, variant: full }
          - { runner: macos-latest, target: aarch64-apple-darwin, variant: trial }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, variant: trial }
    runs-on: ${{ matrix.runner }}
    env:
      TRIAL_DAYS: ${{ inputs.trial_days || '180' }}
      # the key the updater files are signed with (its public half is in tauri.conf.json); a secret, never in the repository
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # the trial variant stops working after the given number of days from its first start (VITE_TRIAL_DAYS, see src/trial.ts)
      # a trial build looks for its updates in its own list (src-tauri/tauri.trial.conf.json)
      - run: npx tauri build --target ${{ matrix.target }} --bundles app,dmg ${{ matrix.variant == 'trial' && '--config src-tauri/tauri.trial.conf.json' || '' }}
        env:
          VITE_TRIAL_DAYS: ${{ matrix.variant == 'trial' && env.TRIAL_DAYS || '' }}

      - name: Check the app signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/${{ matrix.target }}/release/bundle/macos/Imudist.app

      - name: Mark the trial installer in its name
        if: matrix.variant == 'trial'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/dmg
          for f in *.dmg; do mv "$f" "${f%.dmg}-trial-${TRIAL_DAYS}d.dmg"; done

      - uses: actions/upload-artifact@v4
        with:
          name: imudist-mac-${{ matrix.variant == 'trial' && format('trial-{0}d', env.TRIAL_DAYS) || 'full' }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # the Mac builds become updates: each installer goes to the release of the releases repository, and the list the programs read is changed
  publish:
    needs: build-mac
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      TRIAL_DAYS: ${{ inputs.trial_days || '180' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        run: |
          gh auth setup-git
          git config --global user.name "Imudist releases"
          git config --global user.email "releases@imudist.invalid"
          version=$(node -p "require('./package.json').version")
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            case $target in aarch64-apple-darwin) platform=darwin-aarch64; arch=aarch64;; *) platform=darwin-x86_64; arch=x86_64;; esac
            full="artifacts/imudist-mac-full-$target"
            trial="artifacts/imudist-mac-trial-${TRIAL_DAYS}d-$target"
            node scripts/publish-update.mjs --channel regular --platform $platform --clone "$RUNNER_TEMP/releases"               --file "$full/macos/Imudist.app.tar.gz" --sig "$full/macos/Imudist.app.tar.gz.sig" --asset-name "Imudist_${version}_${arch}.app.tar.gz"
            node scripts/publish-update.mjs --channel trial --platform $platform --clone "$RUNNER_TEMP/releases"               --file "$trial/macos/Imudist.app.tar.gz" --sig "$trial/macos/Imudist.app.tar.gz.sig" --asset-name "Imudist_${version}-trial-${TRIAL_DAYS}d_${arch}.app.tar.gz"
          done
