name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, variant: full, trial_days: '' }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, variant: full, trial_days: '' }
          - { runner: macos-latest, target: aarch64-apple-darwin, variant: trial, trial_days: '180' }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, variant: trial, trial_days: '180' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # the trial variant stops working 180 days after its first start (VITE_TRIAL_DAYS, see src/trial.ts)
      - run: npx tauri build --target ${{ matrix.target }} --bundles app,dmg
        env:
          VITE_TRIAL_DAYS: ${{ matrix.trial_days }}

      - name: Check the app signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/${{ matrix.target }}/release/bundle/macos/Imudist.app

      - name: Mark the trial installer in its name
        if: matrix.variant == 'trial'
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/dmg
          for f in *.dmg; do mv "$f" "${f%.dmg}-trial.dmg"; done

      - uses: actions/upload-artifact@v4
        with:
          name: imudist-mac-${{ matrix.variant }}-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
